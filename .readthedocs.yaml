# Read the Docs build configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# Required since September 2023: builds without this file fail.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"
  apt_packages:
    # nbsphinx shells out to pandoc to convert the example notebooks.
    - pandoc

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: false

python:
  install:
    - requirements: docs/requirements.txt
    # conf.py does `import uniport`, and autosummary imports each documented
    # module, so the package has to be importable at build time.
    - method: pip
      path: .

formats:
  - htmlzip
